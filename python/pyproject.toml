[project]
name = "advanced-ai-integration-python"
version = "1.0.0"
description = "Production GenAI API Integrations Course Examples (OpenAI, Anthropic, Gemini, LiteLLM)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.49.0",
    "google-genai>=1.3.0",
    "httpx>=0.28.0",
    "litellm>=1.60.0",
    "openai>=1.65.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "rich>=13.9.0",
    "tenacity>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

